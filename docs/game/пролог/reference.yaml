# Справочник. Строка на термин, доступен с первой минуты, никогда не головоломка
# ([[07-оболочка-тз]], «Управление» → F1).
#
# Сюда переезжает всё, что честно, интересно и не работает на историю. Правило:
# если факт нужен сцене — он в сцене; если он просто правда — он здесь.
# Игрок может взять, может не брать; ни один узел на справочник не опирается.

физика:
  проектная авария: >
    Авария, условия которой перечислены в проекте. На неё рассчитывают оболочку.
  запроектная авария: >
    Авария, условия которой в проекте не перечислены.
  остаточное тепловыделение: >
    Тепло от распада осколков деления. Сразу после остановки — около 7% мощности,
    через сутки — полпроцента. От гигаватта это пять мегаватт, и деть их некуда.
  контейнмент: >
    Защитная оболочка реактора — герметичное здание, последний барьер между
    топливом и улицей. Рассчитывается на проектную аварию.
  реакторное здание: >
    Строение вокруг защитной оболочки. Барьер — оболочка; здание над ней это
    стены и крыша. На Фукусиме-дайити взорвались именно здания.
  четыре барьера: >
    Таблетка топлива, трубка вокруг неё, корпус реактора, оболочка здания.
    Курс контейнмента — про последний.
  цирконий: >
    Материал трубок. Выбран потому, что почти не поглощает нейтроны. При 1200 °C
    отбирает кислород у пара, оставляя водород.
  бор: >
    Соединения бора растворяют в воде и подают в зону: бор поглощает нейтроны.
    Если воды нет, подавать нечем.
  изоляционный конденсатор: >
    Бак с водой выше реактора. Пар сам идёт в него вверх, там остывает, вода
    сама течёт обратно. Ни насоса, ни электричества; запаса на восемь часов.
    Стоял на первом блоке Фукусимы-дайити.
  химический взрыв: >
    Водород горит, а не делится. Ядерного взрыва на энергетическом реакторе
    не бывает — топливо для этого слишком бедное. Разрушения механические,
    а опасен такой взрыв тем, что вскрывает.
  отказобезопасная логика: >
    Правило, по которому арматура при потере сигнала занимает безопасное
    положение — обычно закрывается. Задвижки изоляционного конденсатора
    закрылись по нему сами, когда пропало питание.
  турбонасос: >
    Аварийный насос, турбину которого крутит собственный пар реактора.
    Электричества не просит, но клапанами управляют с батарей. Стоял
    на втором и третьем блоках, не на первом.
  постоянный ток: >
    Батареи станции. Держат приборы, связь и арматуру, а не большие насосы.
    Проектный запас считают часами, а не сутками.
  конечный поглотитель тепла: >
    То, куда станция в итоге девает тепло: море, река, пруд-охладитель,
    воздух через градирню. К аварийной подаче воды в зону отношения не имеет.
  расчётная волна: >
    Высота цунами, на которую рассчитана площадка. Получается из записей
    наблюдений с запасом — и потому не бывает выше того, что уже случалось.
  РБМК: >
    Реактор, где нейтроны тормозит графит, а не вода. Вода ушла — торможение
    осталось, охлаждение нет. Другая конструкция и другая авария.
  быстрый реактор: >
    Работает на быстрых нейтронах, без замедлителя. Теплоноситель — натрий,
    который горит на воздухе, поэтому контуров три, и последний с водой.
  ОЯТ: >
    Отработанное топливо. Годы в бассейне под водой, потом в сухих контейнерах.
    Охлаждать надо и его.
  шкала ИНЕС: >
    Международная шкала ядерных событий, от нуля до семи. Седьмой уровень —
    крупный выброс радиоактивных веществ с широкими последствиями для здоровья
    и окружающей среды. Оценку получает авария целиком, а не отдельный блок.
    Случаев два: Чернобыль, 1986, и Фукусима-дайити, 2011. Восьмого уровня нет.
  Mark I: >
    Тип защитной оболочки, 1967. Компактный: колба, под ней кольцо с водой.
    На Фукусиме-дайити стояли такие.
  кольцо с водой: >
    Бассейн под оболочкой, по-инженерному тор. Пар из реактора уходит в него
    и там конденсируется. Вода в кольце греется и перестаёт принимать пар.
места:
  градирня: >
    Башня, в которой воду охлаждают воздухом. Ставят там, где рядом нет
    ни моря, ни реки.
  Библис: >
    АЭС на Рейне, два блока. Заглушены в марте 2011 по мораторию.
