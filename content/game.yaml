title: Принято к сведению
# 2: флаг помнит дату сцены, в которой поставлен, а не только факт.
# 3: игра помнит, какие сплэши уже показаны.
# 4: текущая дата уехала из сейва — она берётся из заметки; взамен появились сроки.
# 5: игра помнит, что обучающий экран показан.
# 6: подсказка-пример уходит по выполненной команде, а не по счётчику.
# 7: предметы многостраничные — игра помнит, где открыта книга.
saveVersion: 7

# Только порядок эпизодов: game.yaml — витрина (07-оболочка-тз, «game.yaml»).
# Всё остальное — title, renderer, entry, verbs, характеры, сроки, обучение,
# палитра, звук — живёт в episode.yaml и только там. Тогда не нужно правило
# приоритета: у каждого поля ровно один владелец, и расходиться нечему.
# Поле сверх `id` здесь — ошибка сборки.
episodes:
  - id: prolog

renderers:
  academic:
    # frame — рамка объектов: оверлеи дела и предметов, титульная карточка.
    # rule — линейка между потоком и вводом, единственная на экране.
    frame: heavy
    rule: heavy

    # Длительности показа здесь нет намеренно: полноэкранный кадр ждёт Enter,
    # и решение «игрок уже посмотрел» машина за него не принимает
    # (07-оболочка-тз, «Полноэкранный кадр ждёт Enter»).

    # Палитра — Gotham (gotham-default.itermcolors). Роли разведены цветом,
    # а порядок задан контрастом к фону: чем важнее, тем светлее.
    #
    #   собеседник  11.2:1   он ведёт сцену
    #   Марго        6.4:1
    #   ремарка      5.5:1   описания, основной объём текста
    #   подсказки    4.1:1
    #   эхо, рамка   2.3:1   служебное, должно уходить назад
    #
    # Два серых (dim и remark) в самой теме отсутствуют: у Gotham между
    # #4e5166 (2.4:1) и #99d1ce (11.2:1) пусто, а описания на 2.4 не читаются.
    # Эти два выведены из её же гаммы — обесцвеченный сине-зелёный.
    palette:
      bg: "#0c1014"      # фон
      fg: "#99d1ce"      # основной текст
      dim: "#67767e"     # подсказки, разделители
      accent: "#edb443"  # жёлтый: подсветка набранного и стрелки прокрутки
      frame: "#195466"   # синий: рамка оверлеев
      rule: "#195466"    # синий: линейка

      # Кто говорит: собеседник — белым, Марго — зелёным, ремарка — серым.
      speech: "#99d1ce"
      margo: "#2aa889"
      remark: "#7d8c95"

      # Введённая команда: она уже прозвучала и уходит на второй план.
      echo: "#4e5166"

      # Статус — полоса машины, у неё своя подложка: иначе дата висит в пустоте
      # и читается как обрывок текста.
      statusBg: "#11212b"
      statusFg: "#7d8c95"

      # Разметка означает механику, а не важность: подсвечено то, что можно
      # набрать в строке ввода. Слова дела — жёлтым, как и набранное; коды
      # и обозначения — тем же синим, что рамка: это машинное, не сказанное.
      word: "#edb443"
      code: "#599cab"

      # Категории опций в списке команд. Действия с окружением — приглушённо-
      # голубым, сюжетные идут основным `fg`, служебные — холодным серым:
      # оболочка не должна спорить с миром сцены за внимание.
      environment: "#599cab"
      story: "#99d1ce"
      system: "#6b7a80"

      # Команда, закрывающая текущие возможности: приглушённо-жёлтый. Цвет —
      # не единственный сигнал, ту же работу делает знак `▶`.
      advance: "#c4a05a"

      # Предпросмотр реплики: приглушён, потому что это ещё не сказанное.
      # Скажет — придёт в поток обычным цветом Марго.
      preview: "#4e7f70"

      error: "#c23127"
    # rows — единственная настройка размера: сколько строк должно влезать в окно.
    # Кегль выводится из высоты, ширина получается сама — сколько таких знаков
    # поместилось, столько и колонок, а поля набираются пробелами (metrics.ts).
    #
    # 34 — потому что при пропорциях ноутбучного окна это даёт около сотни колонок:
    # строка подсказок вмещает все пять глаголов с хоткеями, а строка текста не
    # растягивается на всю ширину монитора. Меньше строк — крупнее буквы и короче
    # строка, больше — мельче и длиннее.
    #
    # line — межстрочный интервал. Единица значит, что клетки стыкуются:
    # рейки рамки идут сплошной линией, полублоки портрета не разъезжаются.
    font: {family: "JetBrains Mono", size: 16, rows: 34, line: 1}
    effects: []
    ambience: audio/tu-hall.ogg
    keyboard: audio/kbd-mech.ogg
