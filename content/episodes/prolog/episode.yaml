id: prolog
title: Берлин, 2024
renderer: academic

# Точка входа — вступление: два кадра, название и личное дело, и только потом
# комната с командной строкой. Сцена 1 запускается по «поговорить с Тоби»
# (пролог/00-карта.md).
entry: scenes/00-intro

# Обучающий слой: подсказка-пример висит поверх терминала в первой комнате
# и уходит после третьей введённой команды. Экран управления показывается перед
# ней сам и дальше живёт клавишей `3`.
tutorial:
  at: rooms/00-room
  hint: осмотреть учебник

# Сроки: имя → подпись в статусе и начальная дата. Статус показывает их после
# текущей даты и сам считает, сколько осталось: `11.09.2026 · BLUE CARD 111 дней`.
#
# Карта у Марго с самого начала, поэтому дата стоит здесь: на первом экране
# пролога уже 810 дней, к подписи в деканате остаётся 111. Число нигде не
# записано и не сопровождается — статус вычитает его из текущей даты сам.
#
# Сдвинуть срок может любой узел, если по сюжету карту перевыпустят:
#
#   - dates: {blueCard: 31.12.2028}
#
# Механизм общий: любой следующий срок — слушание, подача, хранение — заводится
# такой же строчкой, кода для этого писать не надо.
dates:
  blueCard: {label: BLUE CARD, at: 31.12.2026}

# Глаголы персонажа. Марго спорит — отсюда «ответить» и отсюда же отсутствие
# всего, чем управляют: пультов у неё нет и не будет.
verbs: [спросить, ответить, осмотреть, идти, взять]

# Глаголы, которые приносят предметы. В строку подсказок не попадают никогда.
itemVerbs: [позвонить, вернуть]

# ДЕМО: чем показывать меньше написанного. Переход в закрытую заметку
# не появляется в строке ввода; граф при этом целый, валидатор доволен.
#
# Сейчас открыто всё, включая третий день. Закрыть его обратно — вернуть
# `scenes/03-birthday` в список ниже: в неё ведёт безымянный маршрут из
# `02-neukoelln#улица`, и Нойкёльн тогда просто кончается на последней реплике.
# Правка живёт здесь, а не в самих заметках, потому что `npm run sync`
# перезаписывает их из Obsidian.
closed: []

characters: [margo]
